name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
  push:
    branches:
      - dev
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_COVERAGE_MIN: "9.0"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Run Go tests with coverage
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Summarize Go coverage
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')"
          coverage="${total%\%}"
          {
            echo "### API coverage"
            echo
            echo "Total statement coverage: ${total}"
            echo "Minimum required coverage: ${API_COVERAGE_MIN}%"
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v coverage="$coverage" -v minimum="$API_COVERAGE_MIN" 'BEGIN {
            if ((coverage + 0) < (minimum + 0)) {
              printf("API coverage %.1f%% is below the %.1f%% minimum\n", coverage, minimum) > "/dev/stderr"
              exit 1
            }
          }'

      - name: Upload Go coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-go-coverage
          path: |
            api/coverage.out
            api/coverage.txt
          if-no-files-found: error

  api-postgres-integration:
    name: API PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: unipost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d unipost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PUBLISHING_RESTRICTION_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/unipost_test?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Run publishing restriction and migration gate PostgreSQL integration tests
        run: |
          set -euo pipefail
          test_selector='^(?:TestMigrationGatePostgresApplies125OnlyAfterVerifiedBackup|TestMigrationGatePostgresFailureBeforeVerificationLeaves124Unchanged|TestMigrationGatePostgresExcludesHistoricalRunMigrationsUntilBackupVerified|TestMigrationGatePostgresConcurrentPreDeploysCreateOneBackup|TestMigrationGatePostgresReplacementAfterLockedOrphanCreatesFreshBackup|TestRequireCurrentSchemaRejects124AndAccepts125|TestRequireCurrentSchemaRejectsNewerDatabaseAsUnsafeRollback|TestPublishingRestrictionFailedRecipientUpgradeConvergesAfterExecuted124|TestCreateEmailSendAttemptAuditPreservesTerminalSentRecord|TestCreateEmailSendAttemptAuditStillRetriesFailedRecord|TestFinalizeRestrictedPostDeliveryJobPostgresLeaseAtomicity|TestRecoveryCampaignUsesCurrentCanonicalIdentityAndRejectsReassignedEmail|TestPublishingRestrictionTerminalFailureManualRetryPreservesProviderIdentity|TestPublishingRestrictionManualRetryRejectsExpiredProviderIdempotencyWindow|TestPublishingRestrictionRecipientSentTransitionAggregatesCampaignAtomically|TestPublishingRestrictionStaleSendingReconcilesSentAuditWithoutReclaiming|TestPublishingRestrictionStaleSendingRecoversDefinitiveFailureAsRetryable|TestPublishingRestrictionDefinitiveFailureRejectsLostSendClaim|TestPublishingRestrictionCampaignRefreshRejectsMissingCampaign|TestPublishingRestrictionAuditFinalizationFailureReconcilesWithoutDuplicateSend|TestPublishingRestrictionCanceledDefinitiveFailureRecoversAfterRecipientWriteFailure|TestPublishingRestrictionRecipientSentRecoversAfterTransientCampaignRefreshFailure|TestPublishingRestrictionClaimReconcilesRunningCampaignAfterPriorRefreshFailure|TestPublishingRestrictionRecipientClaimSkipsRowLockedByConcurrentTransaction|TestPublishingRestrictionStaleSendingTerminatesAndCannotBeReclaimed|TestPublishingRestrictionStaleLinkedPreSendFailureRetriesWithFreshAuditAttempt|TestPublishingRestrictionStalePreSendClaimRecoversWithoutUnknownOutcome|TestPublishingRestrictionDelayedAuditSentCannotRacePastStaleReconciliation)$'

          assert_exact_tests() {
            local package="$1"
            shift
            local list_output
            list_output="$(go test -tags=integration "$package" -list "$test_selector")"
            local actual_tests
            actual_tests="$(printf '%s\n' "$list_output" | awk '/^Test/ { print $1 }' | sort)"
            local expected_tests
            expected_tests="$(printf '%s\n' "$@" | sort)"
            if [[ -z "$actual_tests" || "$actual_tests" != "$expected_tests" ]]; then
              echo "PostgreSQL test selection mismatch for ${package}" >&2
              diff -u \
                <(printf '%s\n' "$expected_tests") \
                <(printf '%s\n' "$actual_tests") >&2 || true
              exit 1
            fi
          }

          assert_exact_tests ./internal/db \
            TestMigrationGatePostgresApplies125OnlyAfterVerifiedBackup \
            TestMigrationGatePostgresFailureBeforeVerificationLeaves124Unchanged \
            TestMigrationGatePostgresExcludesHistoricalRunMigrationsUntilBackupVerified \
            TestMigrationGatePostgresConcurrentPreDeploysCreateOneBackup \
            TestMigrationGatePostgresReplacementAfterLockedOrphanCreatesFreshBackup \
            TestRequireCurrentSchemaRejects124AndAccepts125 \
            TestRequireCurrentSchemaRejectsNewerDatabaseAsUnsafeRollback \
            TestPublishingRestrictionFailedRecipientUpgradeConvergesAfterExecuted124 \
            TestCreateEmailSendAttemptAuditPreservesTerminalSentRecord \
            TestCreateEmailSendAttemptAuditStillRetriesFailedRecord
          assert_exact_tests ./internal/handler \
            TestFinalizeRestrictedPostDeliveryJobPostgresLeaseAtomicity
          assert_exact_tests ./internal/worker \
            TestRecoveryCampaignUsesCurrentCanonicalIdentityAndRejectsReassignedEmail \
            TestPublishingRestrictionTerminalFailureManualRetryPreservesProviderIdentity \
            TestPublishingRestrictionManualRetryRejectsExpiredProviderIdempotencyWindow \
            TestPublishingRestrictionRecipientSentTransitionAggregatesCampaignAtomically \
            TestPublishingRestrictionStaleSendingReconcilesSentAuditWithoutReclaiming \
            TestPublishingRestrictionStaleSendingRecoversDefinitiveFailureAsRetryable \
            TestPublishingRestrictionDefinitiveFailureRejectsLostSendClaim \
            TestPublishingRestrictionCampaignRefreshRejectsMissingCampaign \
            TestPublishingRestrictionAuditFinalizationFailureReconcilesWithoutDuplicateSend \
            TestPublishingRestrictionCanceledDefinitiveFailureRecoversAfterRecipientWriteFailure \
            TestPublishingRestrictionRecipientSentRecoversAfterTransientCampaignRefreshFailure \
            TestPublishingRestrictionClaimReconcilesRunningCampaignAfterPriorRefreshFailure \
            TestPublishingRestrictionRecipientClaimSkipsRowLockedByConcurrentTransaction \
            TestPublishingRestrictionStaleSendingTerminatesAndCannotBeReclaimed \
            TestPublishingRestrictionStaleLinkedPreSendFailureRetriesWithFreshAuditAttempt \
            TestPublishingRestrictionStalePreSendClaimRecoversWithoutUnknownOutcome \
            TestPublishingRestrictionDelayedAuditSentCannotRacePastStaleReconciliation

          go test -tags=integration ./internal/db ./internal/handler ./internal/worker \
            -run "$test_selector" -count=1 -v

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DASHBOARD_BASE_URL: http://localhost:3000
      DASHBOARD_WEB_SERVER: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_LANDING_URL: http://localhost:3000
      NEXT_PUBLIC_APP_HOST: localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_DEVELOPMENT_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: sk_test_dummy
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate release guardrails
        working-directory: ${{ github.workspace }}
        run: node --test scripts/preview/*.test.mjs

      - name: Run dashboard source regression
        run: npm run test:docs-ai

      - name: Run dashboard SEO source regression
        run: npm run test:seo

      - name: Run publishing restriction frontend contracts
        run: npm run test:publishing-restrictions

      - name: Build dashboard
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run dashboard smoke regression
        run: npm run test:regression:dashboard

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-dashboard-playwright-report
          path: dashboard/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-dashboard-test-results
          path: dashboard/test-results
          if-no-files-found: ignore
