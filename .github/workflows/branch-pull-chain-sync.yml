name: Branch Pull Chain Sync

# Down-syncs the environment branches so each lower environment "pulls" from
# the layer above it:
#
#   prod (main) --> staging --> dev
#
# staging pulls from main (prod); dev pulls from staging. This keeps hotfixes
# and production merges flowing down into the lower environments.
#
# Trigger: manual only (workflow_dispatch). Pick which leg(s) to run.
#
# NOTE: this performs a direct merge-and-push to the shared staging/dev
# branches, bypassing the normal PR + Preview Acceptance gate described in
# AGENTS.md. Run it deliberately, only when a down-sync is intended.

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "Which sync leg(s) to run"
        type: choice
        required: true
        default: full-chain
        options:
          - full-chain        # main -> staging, then staging -> dev
          - prod-to-staging   # main -> staging only
          - staging-to-dev    # staging -> dev only

permissions:
  contents: write

concurrency:
  group: branch-pull-chain-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Down-sync environment branches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync prod -> staging
        if: ${{ inputs.leg == 'full-chain' || inputs.leg == 'prod-to-staging' }}
        run: ./scripts/sync/pull-chain.sh main staging

      - name: Sync staging -> dev
        if: ${{ inputs.leg == 'full-chain' || inputs.leg == 'staging-to-dev' }}
        run: ./scripts/sync/pull-chain.sh staging dev
